# Copy OUTSIDE the Git checkout as application-runtime.properties; owner access only.
# Set credentials locally. Never commit the filled file.
spring.datasource.url=jdbc:oracle:thin:@DB_HOST:DB_PORT:xe
spring.datasource.username=
spring.datasource.password=
server.address=127.0.0.1
server.port=8080
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
spring.sql.init.mode=never
logging.level.root=INFO
debug=false
spring.profiles.active=production
campusrent.auth.block-demo-accounts=true
campusrent.auth.account-limit=20
campusrent.auth.ip-limit=100
